; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:micro]
platform = atmelavr
board = sparkfun_promicro16
framework = arduino
lib_deps =
	robtillaart/AS5600@^0.6.6
	robtillaart/TCA9548@^0.3.0
	arminjo/digitalWriteFast@^1.3.0
	
; FFB protocol trace over Serial 115200. Line format legend + how to read it:
; see defines.h. Do NOT run the config tool at the same time (shares Serial).
; Watch it with:  pio device monitor -b 115200
;   FFB_SERIAL_TRACE       O + F lines (EffectOperation + force snapshot), ~315 B flash.
;                          This is the one for "did the stop reach the device, and did
;                          the force actually go to zero" - fits with ~78 B to spare.
;   FFB_SERIAL_TRACE_FULL  adds C + D lines (CreateNewEffect + DeviceControl). Needs
;                          BOTH flags set, and does NOT currently fit - free flash first.
; There was an FFB_PROFILE build here: a ~2 Hz 'P' line that bracketed getEffectForce
; with micros() to show where forceCalculator's time went. It answered its questions
; (getEffectForce is ~89% of the loop; constant/periodic cost more than conditions, which
; is what sent us after sin()) and was removed once they were closed - it also crashed
; when built alongside the sine table, for a reason never found. The F line's loops field
; measures loop rate well enough, without instrumenting the thing it measures.
; Set FFB_SERIAL_TRACE, or nothing for a release build:
; build_flags = -D FFB_SERIAL_TRACE
; AVR linker relaxation: call/jmp (4 B) -> rcall/rjmp (2 B) where the target is in range.
; Worth ~558 B. PlatformIO does not forward -mrelax from build_flags to the link step, so
; it has to be appended to LINKFLAGS by the script. Briefly suspected in the 2026-09-03
; reboot regression and then CLEARED by testing it alone - that was a firmware bug (the
; force loop writing effect.startTime, which races the USB-ISR memset in CreateNewEffect).
extra_scripts = pre:relax.py