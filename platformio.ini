; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:micro]
platform = atmelavr
board = sparkfun_promicro16
framework = arduino
lib_deps =
	robtillaart/AS5600@^0.6.6
	robtillaart/TCA9548@^0.3.0
	arminjo/digitalWriteFast@^1.3.0
	
; FFB protocol trace over Serial 115200. Line format legend + how to read it:
; see defines.h. Do NOT run the config tool at the same time (shares Serial).
; Watch it with:  pio device monitor -b 115200
;   FFB_SERIAL_TRACE       O + F lines (EffectOperation + force snapshot), ~315 B flash.
;                          This is the one for "did the stop reach the device, and did
;                          the force actually go to zero" - fits with ~78 B to spare.
;   FFB_SERIAL_TRACE_FULL  adds C + D lines (CreateNewEffect + DeviceControl). Needs
;                          BOTH flags set
;   FFB_STACK_TRACE        S line only: stackFree, prevMin and uptime, ~1 Hz from loop().
;                          ~590 B flash, +14 B RAM (measured: 28194 vs 27606 with the
;                          friction block on).  Most of that is not the line itself - it is
;                          Print's integer formatting, which a release build never links.
;                          INDEPENDENT of the two above - this is the one to
;                          use when hunting a reset, because the F line only prints while a
;                          host is driving effects and so says nothing in the seconds after
;                          a reboot, which is exactly when prevMin matters. Being small, it
;                          also leaves room for whatever code you are trying to reproduce
;                          the crash with. Watch upSec: if it drops back to 0, it reset.
; Pick ONE build_flags line (INI keeps the last one), or comment them all out for release:
; build_flags = -D FFB_SERIAL_TRACE
; build_flags = -D FFB_STACK_TRACE
; build_flags = -D FFB_SERIAL_TRACE -D FFB_STACK_TRACE

; AVR linker relaxation: call/jmp (4 B) -> rcall/rjmp (2 B) where the target is in range.
; Worth ~558 B. PlatformIO does not forward -mrelax from build_flags to the link step, so
; it has to be appended to LINKFLAGS by the script. Briefly suspected in the 2026-09-03
; reboot regression and then CLEARED by testing it alone - that was a firmware bug (the
; force loop writing effect.startTime, which races the USB-ISR memset in CreateNewEffect).
extra_scripts = pre:relax.py